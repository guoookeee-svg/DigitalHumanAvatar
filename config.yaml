###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
batch_size: 16

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: gpt-sovits                # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: 'ref_audio.wav'      # voice name or reference audio file path (wav, 16kHz, mono)
REF_TEXT: '大家好，我是数字人助手，很高兴认识你。今天天气真不错，我们一起来聊聊吧。'  # reference text for voice cloning (English or Chinese)
TTS_SERVER: 'http://127.0.0.1:9880'  # TTS server URL, no trailing slash

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
